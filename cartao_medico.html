<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cartão de visitas digital</title>
<style>
  :root{
    --c1:#86b8aa; --c2:#5b7bc2;      /* cores do topo (degradê) */
    --accent:#4a68b5;                 /* cor dos ícones e detalhes */
    --ink:#1f2937; --muted:#6b7280; --line:#eceff3; --wa:#1f9d57;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:#f5f7fb;color:var(--ink);
       display:flex;justify-content:center;padding:16px;-webkit-font-smoothing:antialiased}
  .card{width:100%;max-width:420px;background:#fff;border-radius:28px;overflow:hidden;box-shadow:0 10px 30px rgba(31,41,55,.12)}

  .hero{background:linear-gradient(180deg,var(--c1),var(--c2));color:#fff;text-align:center;
        padding:36px 20px 78px;clip-path:polygon(0 0,100% 0,100% 90%,0 100%)}
  .avatar{width:112px;height:112px;border-radius:50%;border:6px solid #fff;margin:0 auto 18px;overflow:hidden;
          background:rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;
          font-size:36px;font-weight:700;letter-spacing:1px}
  .avatar img{width:100%;height:100%;object-fit:cover;display:block}
  h1{font-size:26px;line-height:1.2;font-weight:700}
  .esp{margin-top:8px;font-size:17px;opacity:.95}
  .crm{margin-top:6px;font-size:14px;opacity:.85}

  .actions{display:flex;justify-content:center;gap:18px;margin-top:-36px;position:relative;z-index:2}
  .actions a{width:60px;height:60px;border-radius:50%;background:#fff;color:var(--accent);display:flex;
             align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(31,41,55,.15);text-decoration:none}
  .actions a:active{transform:scale(.96)}
  svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

  .bio{padding:22px 28px 6px;text-align:center;color:var(--muted);font-size:15px;line-height:1.55}

  .info{margin:16px 16px 0;border-radius:18px;box-shadow:0 4px 20px rgba(31,41,55,.08);padding:4px 16px}
  .row{display:flex;gap:14px;padding:16px 0;border-bottom:1px solid var(--line);align-items:flex-start}
  .row:last-child{border-bottom:0}
  .ico{flex:0 0 46px;height:46px;border-radius:50%;background:#f5f6f8;color:#6b7280;display:flex;align-items:center;justify-content:center}
  .ico svg{width:22px;height:22px}
  .lbl{font-size:13px;color:var(--muted)}
  .val{margin-top:2px;font-size:16px;line-height:1.4;color:var(--ink);word-break:break-word}
  .val a{color:inherit;text-decoration:none}
  .pill{display:inline-block;margin-top:10px;padding:8px 16px;border-radius:999px;background:#eef2fb;color:var(--accent);
        font-size:13px;text-decoration:none;font-weight:600}

  .cta{padding:20px 16px 26px;display:grid;gap:12px}
  .btn{display:flex;align-items:center;justify-content:center;gap:10px;padding:15px;border-radius:14px;font-size:16px;
       font-weight:600;text-decoration:none;border:2px solid transparent;cursor:pointer;font-family:inherit}
  .btn svg{width:22px;height:22px}
  .wa{background:var(--wa);color:#fff}
  .save{background:#fff;color:var(--accent);border-color:var(--accent)}
  .hide{display:none!important}
</style>
</head>
<body>
<main class="card">
  <section class="hero">
    <div class="avatar" id="avatar"></div>
    <h1 id="nome"></h1>
    <div class="esp" id="esp"></div>
    <div class="crm" id="crm"></div>
  </section>

  <nav class="actions" id="actions" aria-label="Ações rápidas"></nav>

  <p class="bio" id="bio"></p>

  <section class="info" id="info"></section>

  <section class="cta" id="cta"></section>
</main>

<script>
/* ============================================================
   EDITE SOMENTE ESTE BLOCO.
   Campo vazio ("") = a linha some do cartão automaticamente.
   Quando o local de atendimento mudar, altere "clinica" e "endereco".
   ============================================================ */
const DADOS = {
  nome:          "Dr(a). Nome Sobrenome",
  especialidade: "Especialidade médica",
  crm:           "CRM-SP 000000",
  rqe:           "",                          // ex.: "RQE 00000"
  bio:           "Breve apresentação em uma ou duas frases sobre a atuação e o cuidado com o paciente.",
  telefone:      "+55 11 90000-0000",
  whatsapp:      "5511900000000",             // só números, com 55 + DDD
  mensagemWhatsapp: "Olá! Gostaria de agendar uma consulta.",
  email:         "contato@exemplo.com",
  site:          "",                          // ex.: "https://www.exemplo.com"
  clinica:       "Nome da clínica ou consultório",
  endereco:      "Rua Exemplo, 123 - Sala 45, Bairro, São Paulo - SP, 00000-000",
  linkMapa:      "",                          // opcional: cole o link do Google Maps; se vazio, é criado a partir do endereço
  horario:       "Segunda a sexta, das 8h às 18h",
  foto:          ""                           // opcional: link público de uma imagem. Vazio = iniciais do nome
};
/* ============================================================ */

const ICONS = {
  phone:'<svg viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg>',
  mail:'<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m4 7 8 6 8-6"/></svg>',
  pin:'<svg viewBox="0 0 24 24"><path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.800 12 21 12 21z"/><circle cx="12" cy="9.500" r="2.500"/></svg>',
  globe:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.500 3 14.500 0 18M12 3c-3 3.500-3 14.500 0 18"/></svg>',
  id:'<svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2.500"/><path d="M9 7V5.500A1.500 1.500 0 0 1 10.500 4h3A1.500 1.500 0 0 1 15 5.500V7M3 13h18"/></svg>',
  clock:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  chat:'<svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/><path d="M8.500 10h7"/></svg>',
  user:'<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.500"/><path d="M5 20a7 7 0 0 1 14 0"/></svg>'
};

const $ = id => document.getElementById(id);
const D = DADOS;
const soNumeros = s => (s || "").replace(/[^\d+]/g, "");
const mapaUrl = D.linkMapa || ("https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(D.endereco));

function el(tag, attrs = {}, html) {
  const e = document.createElement(tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (html !== undefined) e.innerHTML = html;
  return e;
}
function link(href, label, icon) {
  const a = el("a", { href, target: "_blank", rel: "noopener", "aria-label": label }, icon);
  return a;
}

/* Topo */
$("nome").textContent = D.nome;
$("esp").textContent = D.especialidade;
$("crm").textContent = [D.crm, D.rqe].filter(Boolean).join(" · ");
if (D.foto) {
  const img = el("img", { src: D.foto, alt: D.nome });
  img.onerror = () => { $("avatar").textContent = iniciais(); };
  $("avatar").appendChild(img);
} else { $("avatar").textContent = iniciais(); }
function iniciais() {
  const p = D.nome.replace(/^(dr\(a\)\.?|dra\.?|dr\.?)\s*/i, "").trim().split(/\s+/);
  return ((p[0] || "")[0] || "") + ((p.length > 1 ? p[p.length - 1][0] : "") || "");
}

/* Botões redondos */
const A = $("actions");
if (D.telefone) A.appendChild(link("tel:" + soNumeros(D.telefone), "Ligar", ICONS.phone));
if (D.email)    A.appendChild(link("mailto:" + D.email, "Enviar e-mail", ICONS.mail));
if (D.endereco) A.appendChild(link(mapaUrl, "Ver no mapa", ICONS.pin));
if (!A.children.length) A.classList.add("hide");

/* Bio */
D.bio ? ($("bio").textContent = D.bio) : $("bio").classList.add("hide");

/* Lista de informações */
const INFO = $("info");
function linha(icon, rotulo, valor, href, extra) {
  if (!valor) return;
  const val = el("div", { class: "val" });
  if (href) { const a = el("a", { href, target: "_blank", rel: "noopener" }); a.textContent = valor; val.appendChild(a); }
  else val.textContent = valor;
  const corpo = el("div", {}, "");
  corpo.appendChild(el("div", { class: "lbl" })).textContent = rotulo;
  corpo.appendChild(val);
  if (extra) corpo.appendChild(extra);
  const r = el("div", { class: "row" });
  r.appendChild(el("div", { class: "ico" }, icon));
  r.appendChild(corpo);
  INFO.appendChild(r);
}
linha(ICONS.phone, "Telefone", D.telefone, "tel:" + soNumeros(D.telefone));
linha(ICONS.mail, "E-mail", D.email, "mailto:" + D.email);
if (D.site) linha(ICONS.globe, "Site", D.site.replace(/^https?:\/\//, ""), D.site);
if (D.endereco) {
  const pill = el("a", { class: "pill", href: mapaUrl, target: "_blank", rel: "noopener" });
  pill.textContent = "Ver no mapa";
  linha(ICONS.pin, D.clinica || "Local de atendimento", D.endereco, null, pill);
}
linha(ICONS.clock, "Horário de atendimento", D.horario);
if (!INFO.children.length) INFO.classList.add("hide");

/* Botões grandes */
const CTA = $("cta");
if (D.whatsapp) {
  const wa = el("a", { class: "btn wa", target: "_blank", rel: "noopener",
    href: "https://wa.me/" + soNumeros(D.whatsapp).replace("+", "") + "?text=" + encodeURIComponent(D.mensagemWhatsapp || "") }, ICONS.chat + "Agendar pelo WhatsApp");
  CTA.appendChild(wa);
}

/* Salvar contato (.vcf) */
const esc = s => (s || "").replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\n/g, "\\n");
function vcard() {
  const partes = D.nome.replace(/^(dr\(a\)\.?|dra\.?|dr\.?)\s*/i, "").trim().split(/\s+/);
  const sobrenome = partes.length > 1 ? partes.pop() : "";
  const linhas = [
    "BEGIN:VCARD", "VERSION:3.0",
    "N:" + esc(sobrenome) + ";" + esc(partes.join(" ")) + ";;" + esc(/^dra/i.test(D.nome) ? "Dra." : "Dr.") + ";",
    "FN:" + esc(D.nome),
    D.clinica ? "ORG:" + esc(D.clinica) : "",
    D.especialidade ? "TITLE:" + esc(D.especialidade) : "",
    D.telefone ? "TEL;TYPE=CELL,VOICE:" + soNumeros(D.telefone) : "",
    D.email ? "EMAIL;TYPE=WORK:" + esc(D.email) : "",
    D.site ? "URL:" + esc(D.site) : "",
    D.endereco ? "ADR;TYPE=WORK:;;" + esc(D.endereco) + ";;;;" : "",
    D.crm ? "NOTE:" + esc([D.crm, D.rqe].filter(Boolean).join(" · ")) : "",
    "END:VCARD"
  ];
  return linhas.filter(Boolean).join("\r\n");
}
const salvar = el("a", { class: "btn save", href: "#", role: "button" }, ICONS.user + "Salvar contato");
salvar.addEventListener("click", ev => {
  ev.preventDefault();
  const blob = new Blob([vcard()], { type: "text/vcard;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = el("a", { href: url, download: "contato.vcf" });
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
});
CTA.appendChild(salvar);
</script>
</body>
</html>
